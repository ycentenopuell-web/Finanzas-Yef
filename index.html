<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Yeferson acp — Finanzas</title>
<style>
:root{--bg:#f1f5f9;--card:#ffffff;--text:#1e293b;--sub:#64748b;--muted:#94a3b8;--border:#e2e8f0;--input:#f8fafc;--brand:#4f46e5;--brand2:#6366f1;--red:#e11d48;--green:#059669;--navh:58px}
html.dark{--bg:#020617;--card:#0f172a;--text:#f1f5f9;--sub:#94a3b8;--muted:#64748b;--border:#1e293b;--input:#1e293b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{font-family:Calibri,Carlito,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;font-size:13px;position:fixed;inset:0}
button,input,select{font:inherit;color:inherit;min-width:0}
button{cursor:pointer;border:0;background:none;padding:0}
.ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;display:block}

.app{position:fixed;inset:0;max-width:448px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
header{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;background:var(--card);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:8px}
.logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#4f46e5,#818cf8);display:flex;align-items:center;justify-content:center;color:#fff}
.brand h1{margin:0;font-size:14px;font-weight:700;line-height:1.1}
.brand small{font-size:9px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;font-weight:600}
.hdr-btns{display:flex;gap:6px}
.icon-btn{width:32px;height:32px;border-radius:50%;background:var(--input);display:flex;align-items:center;justify-content:center;color:var(--sub)}

main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:12px 12px 96px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

nav{flex-shrink:0;background:var(--card);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px)}
nav .tabs{display:flex;align-items:center;height:var(--navh);padding:0 4px;gap:2px}
.tab{flex:1 1 0;min-width:0;height:44px;display:flex;align-items:center;justify-content:center;gap:4px;border-radius:12px;color:var(--muted);font-size:11px;font-weight:700;overflow:hidden}
.tab.on{color:var(--brand2);background:var(--input);flex:2 1 0}
.tab .lbl{display:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab.on .lbl{display:inline}

.fab{position:absolute;right:14px;bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px) + 12px);width:50px;height:50px;border-radius:16px;background:linear-gradient(135deg,#4f46e5,#6366f1);color:#fff;box-shadow:0 8px 20px rgba(79,70,229,.4);z-index:30;display:flex;align-items:center;justify-content:center}

.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px}
.hero{background:linear-gradient(135deg,#0f172a,#1e1b4b);color:#fff;border-color:#312e81;border-radius:20px;padding:14px}
.hero .lab{color:#a5b4fc}
.hero .sm{color:#cbd5e1}
.hero .stat{background:rgba(255,255,255,.07)}
.hero .stat span{color:#94a3b8}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.sm{font-size:11px;color:var(--muted)}
.lab{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.big{font-size:22px;font-weight:800;margin-top:4px;line-height:1.2;word-break:break-word}
.stat{background:var(--input);border-radius:10px;padding:7px 4px;text-align:center;min-width:0}
.stat span{display:block;font-size:9px;color:var(--muted);text-transform:uppercase;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat b{display:block;font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.green{color:#10b981}.red{color:#f43f5e}.brandt{color:var(--brand2)}
.pill{font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;background:rgba(255,255,255,.12);color:#fff;white-space:nowrap}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:8px;min-width:0}
.sec-h h3{margin:0;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--sub)}
.link{color:var(--brand2);font-size:12px;font-weight:700;white-space:nowrap}
.empty{text-align:center;color:var(--muted);font-size:12px;padding:14px 0;margin:0}
.month{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:6px}
.month span{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.month button,.navbtn{width:28px;height:28px;border-radius:9px;background:var(--input);display:flex;align-items:center;justify-content:center;color:var(--sub)}

.tx{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:9px 10px;min-width:0;cursor:pointer}
.tx:active{opacity:.7}
.tx-l{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.cat-dot{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.shop-img{width:44px;height:44px;border-radius:10px;object-fit:cover;flex-shrink:0;background:var(--input)}
.tx-t{min-width:0}
.tx-t b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-t small{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.tx-r{text-align:right;flex-shrink:0}
.amt{font-weight:800;font-size:13px;white-space:nowrap}
.pillbtn{margin-top:3px;padding:2px 7px;border-radius:7px;font-size:10px;font-weight:700;display:inline-block;white-space:nowrap}
.p-ok{background:rgba(16,185,129,.12);color:#10b981}
.p-pend{background:rgba(245,158,11,.12);color:#d97706}
.pay{background:#10b981;color:#fff;padding:4px 10px;border-radius:8px;font-size:11px;font-weight:700}
.del{color:var(--muted);padding:3px 2px;margin-left:2px;vertical-align:middle}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal .dow{text-align:center;font-size:10px;font-weight:700;color:var(--muted);padding-bottom:3px}
.day{height:42px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:4px 1px;font-weight:700;font-size:12px;color:var(--text);min-width:0;overflow:hidden}
.day.sel{background:var(--brand2);color:#fff}
.day.today{box-shadow:inset 0 0 0 1px var(--brand2)}
.badge{font-size:8px;font-weight:800;padding:1px 3px;border-radius:4px;max-width:100%;overflow:hidden;white-space:nowrap}

.seg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;background:var(--input);border-radius:12px;padding:3px}
.seg button{padding:7px 4px;border-radius:9px;font-size:12px;font-weight:700;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--brand2);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button.gasto.on{color:#e11d48}
.seg button.ingreso.on{color:#059669}

.acc{border-radius:18px;color:#fff;padding:14px}
.acc.cr{background:linear-gradient(135deg,#d97706,#e11d48)}
.acc.db{background:linear-gradient(135deg,#4f46e5,#4338ca)}
.acc .k{font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.acc h4{margin:2px 0 0;font-size:15px}
.acc .amt2{font-size:16px;font-weight:800}
.bar{height:6px;background:rgba(0,0,0,.2);border-radius:99px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:#fff}
.acc .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:10px;margin-top:6px;flex-wrap:wrap}
.linkw{color:#fff;text-decoration:underline;font-size:10px}

.bd-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:3px;gap:8px}
.bd-row span:first-child{display:flex;align-items:center;gap:6px;min-width:0}
.bd-track{height:6px;background:var(--input);border-radius:99px;overflow:hidden;margin-bottom:10px}
.bd-track i{display:block;height:100%;border-radius:99px}
.pie-wrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.pie-wrap svg{width:150px;height:150px}
.legend{width:100%;display:flex;flex-direction:column;gap:5px}
.legend div{display:flex;align-items:center;justify-content:space-between;font-size:12px;gap:8px}
.legend span{display:flex;align-items:center;gap:6px;min-width:0}
.legend i{width:10px;height:10px;border-radius:3px;flex-shrink:0}

.form{display:flex;flex-direction:column;gap:10px}
.fld label{display:block;font-size:11px;font-weight:600;color:var(--sub);margin-bottom:3px}
.in{width:100%;background:var(--input);border:1px solid var(--border);border-radius:10px;padding:9px 10px;font-size:14px;color:var(--text);outline:none;height:38px}
.in:focus{border-color:var(--brand2);box-shadow:0 0 0 3px rgba(99,102,241,.25)}
.in.amount{font-size:20px;font-weight:800;height:46px}
.in.small{height:34px;padding:7px 9px}
.hint{font-size:10px;color:var(--muted);margin:-4px 0 0}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.rec{display:flex;flex-direction:column;gap:10px;padding-top:8px;border-top:1px solid var(--border)}
.actions{display:flex;gap:8px;margin-top:4px}
.btn{padding:11px;border-radius:12px;font-weight:700;font-size:13px;text-align:center;flex:1;display:flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{border:1px solid var(--border);color:var(--sub)}
.btn.main{background:var(--brand);color:#fff;flex:2}
.btn.danger{background:var(--red);color:#fff}
.scan{width:100%;padding:10px;border-radius:12px;background:rgba(99,102,241,.12);color:var(--brand2);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.imgrow{display:flex;gap:8px;align-items:center}
.thumb{width:52px;height:52px;border-radius:10px;object-fit:cover;flex-shrink:0;border:1px solid var(--border)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:28px;height:28px;border-radius:50%;border:3px solid transparent}
.sw.on{border-color:var(--text)}

/* Selector de iconos: solo icono; el nombre aparece solo debajo del elegido */
.grid-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:8px}
.itile{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;width:100%}
.ibox{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:var(--input);color:var(--sub);border:1px solid var(--border)}
.itile.on .ibox{color:#fff;border-color:transparent}
.ilbl{height:14px;line-height:14px;font-size:10px;font-weight:700;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--brand2)}

/* Listas tipo menú */
.msec{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:10px 2px 6px}
.menu{background:var(--input);border-radius:14px;overflow:hidden}
.mrow{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px;border-bottom:1px solid var(--border);text-align:left;font-weight:600}
.mrow:last-child{border-bottom:0}
.mrow .r{color:var(--muted);display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.mrow.danger{color:var(--red)}
.lft{display:flex;align-items:center;gap:10px;min-width:0}
.lft small{display:block;font-size:10px;color:var(--muted);font-weight:600}

.modal{position:fixed;inset:0;background:rgba(2,6,23,.7);z-index:50;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.modal.open{opacity:1;pointer-events:auto}
.modal.center{align-items:center;padding:20px}
.sheet{width:100%;max-width:448px;background:var(--card);border:1px solid var(--border);border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:90vh;max-height:90dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateY(100%);transition:transform .25s ease}
.modal.open .sheet{transform:none}
.sheet.sm{max-width:300px;border-radius:20px}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sheet-h h3{margin:0;font-size:15px;font-weight:800}
.x{color:var(--muted);padding:4px}
@media (min-width:640px){.modal{align-items:center;padding:16px}.sheet{border-radius:20px}}

.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 8px);background:#0f172a;color:#fff;font-size:12px;font-weight:700;padding:8px 14px;border-radius:12px;box-shadow:0 8px 20px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .3s;z-index:90;max-width:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}
html.dark ::-webkit-scrollbar-thumb{background:#334155}
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="brand">
      <div class="logo"><svg class="ic" viewBox="0 0 24 24"><path d="M19 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0 0 4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h14v-4"/><path d="M21 12h-4a2 2 0 0 0 0 4h4z"/></svg></div>
      <div><h1>Yeferson acp</h1><small>Control Financiero</small></div>
    </div>
    <div class="hdr-btns">
      <button class="icon-btn" id="hideBtn" onclick="toggleHide()" aria-label="Mostrar u ocultar montos"></button>
      <button class="icon-btn" onclick="openModal('settingsModal')" aria-label="Ajustes"><svg class="ic" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg></button>
      <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" aria-label="Cambiar tema"></button>
    </div>
  </header>

  <main id="appContainer"></main>

  <button class="fab" id="fab" onclick="fabAction()" aria-label="Agregar"></button>

  <nav>
    <div class="tabs">
      <button class="tab" id="nav-dashboard" onclick="switchTab('dashboard')"><svg class="ic" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg><span class="lbl">Safe Spend</span></button>
      <button class="tab" id="nav-calendar" onclick="switchTab('calendar')"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span class="lbl">Calendario</span></button>
      <button class="tab" id="nav-accounts" onclick="switchTab('accounts')"><svg class="ic" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg><span class="lbl">Cuentas</span></button>
      <button class="tab" id="nav-transactions" onclick="switchTab('transactions')"><svg class="ic" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span class="lbl">Movimientos</span></button>
      <button class="tab" id="nav-analytics" onclick="switchTab('analytics')"><svg class="ic" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg><span class="lbl">Análisis</span></button>
      <button class="tab" id="nav-shopping" onclick="switchTab('shopping')"><svg class="ic" viewBox="0 0 24 24"><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/><path d="M2 3h3l3 12h11l2-8H6"/></svg><span class="lbl">Compras</span></button>
    </div>
  </nav>
</div>

<!-- MODAL: Ajustes -->
<div id="settingsModal" class="modal">
  <div class="sheet">
    <div class="sheet-h"><h3>Ajustes</h3><button class="x" onclick="closeModal('settingsModal')" aria-label="Cerrar"><svg class="ic" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
    <div class="msec">Gestión</div>
    <div class="menu">
      <button class="mrow" onclick="openCategories()"><span class="lft"><span class="cat-dot" style="background:#6366f122;color:#6366f1"><svg class="ic" viewBox="0 0 24 24"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L2 12V2h10l8.6 8.6a2 2 0 0 1 0 2.8z"/><circle cx="7" cy="7" r="1.5"/></svg></span>Categorías</span><span class="r"><svg class="ic" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></span></button>
    </div>
    <div class="msec">Datos de Excel y respaldo</div>
    <div class="menu">
      <button class="mrow" onclick="exportExcel()"><span>Exportar a Excel (.xlsx)</span><svg class="ic" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg></button>
      <button class="mrow" onclick="downloadTemplate()"><span>Descargar plantilla Excel</span><svg class="ic" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg></button>
      <button class="mrow" onclick="$('importXlsFile').click()"><span>Importar desde Excel</span><svg class="ic" viewBox="0 0 24 24"><path d="M12 21V9M7 14l5-5 5 5M5 3h14"/></svg></button>
      <button class="mrow" onclick="exportBackup()"><span>Guardar respaldo completo (JSON)</span><svg class="ic" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg></button>
      <button class="mrow" onclick="$('backupFile').click()"><span>Restaurar respaldo (JSON)</span><svg class="ic" viewBox="0 0 24 24"><path d="M12 21V9M7 14l5-5 5 5M5 3h14"/></svg></button>
    </div>
    <div class="msec">Zona de peligro</div>
    <div class="menu">
      <button class="mrow danger" onclick="resetData()"><span>Borrar todos los datos</span><svg class="ic" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button>
    </div>
  </div>
</div>

<!-- MODAL: Movimiento -->
<div id="transactionModal" class="modal">
  <div class="sheet">
    <div class="sheet-h"><h3 id="txTitle">Nuevo movimiento</h3><button class="x" onclick="closeModal('transactionModal')" aria-label="Cerrar"><svg class="ic" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
    <form id="txForm" class="form" onsubmit="handleSaveTransaction(event)">
      <div class="seg">
        <button type="button" id="type-gasto" class="gasto on" onclick="setTxType('gasto')">Gasto</button>
        <button type="button" id="type-ingreso" class="ingreso" onclick="setTxType('ingreso')">Ingreso</button>
        <button type="button" id="type-transfer" onclick="setTxType('transfer')">Transferir</button>
      </div>
      <label class="scan" id="scanWrap">
        <svg class="ic" viewBox="0 0 24 24"><path d="M4 7h3l2-3h6l2 3h3v12H4z"/><circle cx="12" cy="13" r="4"/></svg>
        Escanear boleta o factura
        <input type="file" accept="image/*" capture="environment" hidden onchange="scanReceipt(event)">
      </label>
      <p id="scanStatus" class="sm" style="margin:-4px 0 0;text-align:center"></p>
      <div class="fld">
        <label for="txAmount">Monto (S/)</label>
        <input class="in amount" type="number" step="0.01" min="0" inputmode="decimal" id="txAmount" required placeholder="0.00">
      </div>
      <div class="row2">
        <div class="fld" id="txCatWrap">
          <label for="txCategory">Categoría</label>
          <select class="in" id="txCategory" onchange="handleCategoryDropdownChange(this.value)"></select>
        </div>
        <div class="fld">
          <label for="txAccount" id="txAccLabel">Cuenta</label>
          <select class="in" id="txAccount"></select>
        </div>
      </div>
      <div class="fld" id="txToWrap" hidden>
        <label for="txToAccount">Hacia</label>
        <select class="in" id="txToAccount"></select>
      </div>
      <div class="fld">
        <label for="txNote">Descripción</label>
        <input class="in" type="text" id="txNote" placeholder="Ej. Supermercado, luz, sueldo...">
      </div>
      <div class="row2">
        <div class="fld">
          <label for="txDate">Fecha</label>
          <input class="in" type="date" id="txDate" required onchange="txDateTouched=true">
        </div>
        <div class="fld">
          <label for="txPaid">Estado</label>
          <select class="in" id="txPaid">
            <option value="paid">Pagado</option>
            <option value="pending" selected>Pendiente</option>
          </select>
        </div>
      </div>

/* ================= FECHAS Y RECURRENCIA ================= */
function addInterval(dateStr, freq, n){
  const [y,m,d] = dateStr.split('-').map(Number);
  if (freq === 'week') return toDateStr(new Date(y, m-1, d + 7*n));
  if (freq === 'year'){
    const last = new Date(y+n, m, 0).getDate();
    return toDateStr(new Date(y+n, m-1, Math.min(d,last)));
  }
  const target = new Date(y, m-1+n, 1);
  const last = new Date(target.getFullYear(), target.getMonth()+1, 0).getDate();
  return toDateStr(new Date(target.getFullYear(), target.getMonth(), Math.min(d,last)));
}
function processRecurring(){
  const now = new Date();
  const som = toDateStr(new Date(now.getFullYear(), now.getMonth(), 1));
  const eom = toDateStr(new Date(now.getFullYear(), now.getMonth()+1, 0));
  let created = 0;
  db.recurring.forEach(rec => {
    if (!rec.anchor){ rec.anchor = rec.nextDate || todayStr(); rec.k = 1; }
    if (!rec.k) rec.k = 1;
    let guard = 0;
    while (guard++ < 500){
      const nd = addInterval(rec.anchor, rec.freq||'month', (rec.interval||1)*rec.k);
      if (nd > eom) break;
      if (nd >= som){
        db.tx.push({ id:'tx_'+Date.now()+'_'+(created++), type:rec.type, amount:Number(rec.amount)||0,
          cat:rec.cat, date:nd, note:rec.note, paid:'pending', accountId:rec.accountId, recurringId:rec.id });
      }
      rec.k++;
    }
  });
  if (created > 0) persist();
}

/* ================= CÁLCULOS ================= */
function getAccountBalance(acc){
  const initial = Number(acc.initial)||0;
  const delta = db.tx.filter(t => t.paid === 'paid').reduce((s,t) => {
    const a = Number(t.amount)||0;
    if (t.type === 'transfer'){
      if (t.accountId === acc.id) return s - a;
      if (t.transferTo === acc.id) return s + a;
      return s;
    }
    if (t.accountId !== acc.id) return s;
    return s + (t.type === 'ingreso' ? a : -a);
  }, 0);
  return acc.type === 'credit' ? initial - delta : initial + delta;
}
function calculateFinancials(){
  const now = new Date();
  const eom = toDateStr(new Date(now.getFullYear(), now.getMonth()+1, 0));
  const liquidBalance = db.accounts.filter(a => a.type !== 'credit').reduce((s,a) => s + getAccountBalance(a), 0);
  const cardDebt = db.accounts.filter(a => a.type === 'credit').reduce((s,a) => s + Math.max(0, getAccountBalance(a)), 0);
  const pendingTx = db.tx.filter(t => t.paid !== 'paid' && t.type !== 'transfer' && (t.date||'') <= eom);
  const dueBills = pendingTx.filter(t => t.type==='gasto').reduce((s,t) => s + (Number(t.amount)||0), 0);
  const expectedIncome = pendingTx.filter(t => t.type==='ingreso').reduce((s,t) => s + (Number(t.amount)||0), 0);
  const safeToSpend = liquidBalance - cardDebt - dueBills;
  return { liquidBalance, cardDebt, dueBills, expectedIncome, safeToSpend };
}
function getProjectedBalance(dateStr){
  let liquid = db.accounts.filter(a => a.type !== 'credit').reduce((s,a) => s + getAccountBalance(a), 0);
  const today = todayStr();
  db.tx.forEach(t => {
    if (t.paid === 'paid' || !(t.date > today && t.date <= dateStr)) return;
    const amt = Number(t.amount)||0;
    if (t.type === 'ingreso') liquid += amt;
    if (t.type === 'gasto') liquid -= amt;
    if (t.type === 'transfer'){
      const src = db.accounts.find(a => a.id === t.accountId);
      const dest = db.accounts.find(a => a.id === t.transferTo);
      if (src && src.type !== 'credit' && dest && dest.type === 'credit') liquid -= amt;
    }
  });
  return liquid;
}
function avgMonthlyExpense(){
  const now = new Date();
  let total = 0;
  for (let i = 1; i <= 3; i++){
    const p = monthStr(new Date(now.getFullYear(), now.getMonth() - i, 1));
    total += db.tx.filter(t => t.type==='gasto' && t.paid==='paid' && (t.date||'').startsWith(p))
      .reduce((s,t) => s + (Number(t.amount)||0), 0);
  }
  return total / 3;
}
function daysLeftInMonth(){
  const now = new Date();
  return new Date(now.getFullYear(), now.getMonth()+1, 0).getDate() - now.getDate() + 1;
}

  const neg = f.safeToSpend < 0;
  const daysLeft = daysLeftInMonth();
  const daily = Math.max(0, f.safeToSpend) / daysLeft;
  const avg = avgMonthlyExpense();
  const goal = db.emergencyGoal || 3;
  const months = avg > 0 ? f.liquidBalance / avg : null;
  const pct = months === null ? 0 : Math.max(0, Math.min(100, months / goal * 100));

  return `
    ${renderMonthSwitcher()}
    <div class="card hero">
      <div class="sec-h">
        <span class="lab">Gastable seguro (fin de mes)</span>
        <span class="pill">${neg ? 'Por cubrir' : 'Saludable'}</span>
      </div>

      <p class="sm" style="margin:4px 0 0">${neg
        ? `Te faltan ${fmtS(Math.abs(f.safeToSpend))} para cubrir tus compromisos del mes.`
        : 'Libre de compromisos para el resto del mes.'}</p>
      <div class="grid3" style="margin-top:12px;padding-top:10px;border-top:1px solid #1e293b">
        <div class="stat"><span>Disponible</span><b class="green">${fmtS(f.liquidBalance)}</b></div>
        <div class="stat"><span>Tarjetas</span><b class="red">${fmtS(f.cardDebt)}</b></div>
        <div class="stat"><span>Por pagar</span><b class="red">${fmtS(f.dueBills)}</b></div>
      </div>
    </div>
    <div class="grid2">
      <div class="card"><span class="sm">Puedes gastar hoy</span><div class="amt green" style="font-size:15px;margin-top:3px">${fmtS(daily)}</div></div>
      <div class="card"><span class="sm">Días que faltan</span><div class="amt" style="font-size:15px;margin-top:3px">${daysLeft}</div></div>
    </div>
    <div class="section-gap">
      <div class="sec-h"><h3>Próximos vencimientos (7 días)</h3></div>
      ${renderUpcoming()}
    </div>
    ${renderBudgets()}
    <div class="card">
      <div class="sec-h">
        <span class="lab">Colchón de emergencia</span>
        <button class="link" onclick="setEmergencyGoal()">Meta: ${goal} meses</button>
      </div>
      ${months === null
        ? '<p class="sm" style="margin:6px 0 0">Registra gastos pagados de los últimos meses para calcularlo.</p>'
        : `<div class="big" style="font-size:18px">${months.toFixed(1)} meses</div>
           <p class="sm" style="margin:2px 0 0">Tu disponible cubre el gasto promedio de ${fmtS(avg)} al mes.</p>`}
      <div class="bd-track" style="margin:8px 0 0"><i style="width:${pct}%;background:#10b981"></i></div>
    </div>
    <div class="grid2">
      <div class="card"><span class="sm">Ingresos recibidos</span><div class="amt green" style="font-size:15px;margin-top:3px">${db.hideAmt ? 'S/ •••••' : '+S/ ' + money(totalIncome)}</div></div>
      <div class="card"><span class="sm">Gastos pagados</span><div class="amt red" style="font-size:15px;margin-top:3px">${db.hideAmt ? 'S/ •••••' : '−S/ ' + money(totalExpense)}</div></div>
    </div>
    <div class="section-gap">
      <div class="sec-h"><h3>Movimientos recientes</h3><button class="link" onclick="switchTab('transactions')">Ver todos</button></div>
      ${monthTx.length === 0 ? '<p class="empty">No hay movimientos este mes.</p>' : ''}

function renderUpcoming(){
  const lim = toDateStr(new Date(Date.now() + 7 * 864e5));
  const list = db.tx.filter(t => t.paid !== 'paid' && t.type !== 'transfer' && (t.date||'') <= lim)
    .sort((a,b) => (a.date||'').localeCompare(b.date||''));
  if (!list.length) return '<p class="empty">Nada vence en los próximos 7 días.</p>';
  return list.map(t => renderTxRow(t)).join('');
}
function setEmergencyGoal(){
  const v = prompt('¿Cuántos meses de gastos quieres tener ahorrados? (ej. 3, 6)', db.emergencyGoal || 3);
  if (v === null) return;
  const n = parseFloat(v);
  if (!(n > 0)){ showToast('Ingresa un número mayor a 0'); return; }
  db.emergencyGoal = n; persist(); renderApp();
}

/* Tarjeta de balance del mes (pagados). Antes estaba en Movimientos; ahora vive aquí. */
function renderBalanceCard(){
  const list = db.tx.filter(t => (t.date||'').slice(0,7) === currentMonth);
  const inc = list.filter(t => t.type==='ingreso' && t.paid==='paid').reduce((s,t) => s + (Number(t.amount)||0), 0);
  const exp = list.filter(t => t.type==='gasto' && t.paid==='paid').reduce((s,t) => s + (Number(t.amount)||0), 0);
  const net = inc - exp;
  const h = v => db.hideAmt ? '•••' : v;
  return `
    <div class="card">
      <div class="sec-h"><span class="lab">Balance real (pagados)</span><span class="pill" style="background:var(--input);color:var(--sub)">${currentMonth}</span></div>
      <div class="grid3" style="margin-top:8px">
        <div class="stat"><span>Ingresos</span><b class="green">${h('+' + money(inc))}</b></div>
        <div class="stat"><span>Gastos</span><b class="red">${h('−' + money(exp))}</b></div>
        <div class="stat"><span>Neto</span><b class="${net>=0?'brandt':'red'}">${h(money(net))}</b></div>
      </div>
    </div>`;
}
function renderCalendar(){
  const [y,m] = currentMonth.split('-').map(Number);
  const daysInMonth = new Date(y, m, 0).getDate();
  const firstOffset = (new Date(y, m-1, 1).getDay() + 6) % 7;
  const today = todayStr();
  const byDate = {};
  db.tx.forEach(t => { if (t.date) (byDate[t.date] = byDate[t.date] || []).push(t); });
  const dayTx = (byDate[selectedCalDay] || []).filter(t => t.type !== 'transfer');
  const projected = getProjectedBalance(selectedCalDay);

  let cells = ['L','M','X','J','V','S','D'].map(d => `<div class="dow">${d}</div>`).join('');
  for (let i=0;i<firstOffset;i++) cells += '<div></div>';
  for (let d=1; d<=daysInMonth; d++){
    const ds = `${currentMonth}-${pad(d)}`;
    const list = (byDate[ds] || []).filter(t => t.type !== 'transfer');
    const net = list.reduce((s,t) => s + (t.type==='ingreso' ? (Number(t.amount)||0) : -(Number(t.amount)||0)), 0);
    let badge = '';
    if (list.length){
      const col = net >= 0 ? 'color:#10b981;background:rgba(16,185,129,.12)' : 'color:#f43f5e;background:rgba(244,63,94,.12)';
      badge = `<span class="badge" style="${col}">${net>=0?'+':''}${Math.round(net)}</span>`;
    }
    const cls = ['day', ds===selectedCalDay ? 'sel' : '', (ds===today && ds!==selectedCalDay) ? 'today' : ''].join(' ');
    cells += `<button class="${cls}" onclick="selectedCalDay='${ds}'; renderApp();"><span>${d}</span>${badge}</button>`;
  }
  return `
    ${renderMonthSwitcher()}
    <div class="card"><div class="cal">${cells}</div></div>
    ${renderBalanceCard()}
    <div class="card hero" style="padding:12px">
      <span class="sm" style="color:#a5b4fc">Saldo proyectado al ${esc(selectedCalDay)}</span>
      <div class="big" style="font-size:20px">${fmtS(projected)}</div>
      <p class="sm" style="margin:2px 0 0">Dinero líquido más pendientes hasta esta fecha.</p>
    </div>
    <div class="section-gap">
      <h3 class="lab">Movimientos del ${esc(selectedCalDay)}</h3>
      ${dayTx.length === 0 ? '<div class="empty card">Sin movimientos este día.</div>' : ''}
      ${dayTx.map(t => renderTxRow(t, true)).join('')}
    </div>`;
}

function deleteAccount(id){

    db.tx = db.tx.filter(t => t.accountId !== id && t.transferTo !== id);
    db.recurring = db.recurring.filter(r => r.accountId !== id);
    db.shopping.forEach(s => { if (s.accountId === id) s.accountId = ''; });

  db.recurring = db.recurring.filter(r => r.id !== recId);
  db.tx = db.tx.filter(t => !(t.recurringId === recId && t.paid !== 'paid' && (t.date||'') >= today));
  persist(); renderApp(); showToast('Recurrencia cancelada');
}

function handleSaveTransaction(e){
  e.preventDefault();
  if (db.accounts.length === 0){
    closeModal('transactionModal');
    showToast('Primero crea una cuenta');
    openModal('accountModal');
    return;
  }
  const isT = currentTxType === 'transfer';
  const amount = parseFloat($('txAmount').value) || 0;
  const cat = isT ? '' : $('txCategory').value;
  let date = $('txDate').value;
  const accountId = $('txAccount').value;
  const toId = $('txToAccount').value;
  const note = $('txNote').value.trim();
  const paid = $('txPaid').value;
  if (amount <= 0){ showToast('Ingresa un monto mayor a 0'); return; }
  if (isT){
    if (!toId || toId === accountId){ showToast('Elige dos cuentas distintas'); return; }
  } else if (!cat || cat === '__add_new__'){ showToast('Elige una categoría'); return; }
  if (!date){ showToast('Elige una fecha'); return; }

  if (editingId){
    const t = db.tx.find(x => x.id === editingId);
    if (t){
      if (paid === 'paid' && t.paid !== 'paid' && date === t.date) date = todayStr();
      Object.assign(t, { type: currentTxType, amount, cat, date, note, paid, accountId, transferTo: isT ? toId : undefined });
    }
    persist(); closeModal('transactionModal'); renderApp();
    showToast('Movimiento actualizado');
    return;
  }

  if (paid === 'paid' && !txDateTouched) date = todayStr();
  const isRec = !isT && $('txRecurring').value === 'yes';
  let recId = null;
  if (isRec){
    recId = 'rec_' + Date.now();
    db.recurring.push({ id:recId, amount, cat, type:currentTxType, note, freq:$('recFreq').value,
      interval: Math.max(1, parseInt($('recInterval').value) || 1), anchor:date, k:1, accountId });
  }
  db.tx.push({ id:'tx_'+Date.now(), type:currentTxType, amount, cat, date, note, paid, accountId, recurringId:recId, transferTo: isT ? toId : undefined });
  if (isRec) processRecurring();
  persist();
  closeModal('transactionModal');
  resetTxForm();
  renderApp();
  showToast('Movimiento guardado');
}

/* ================= ANÁLISIS ================= */
function pieSVG(slices){
  const R = 60, C = 70;
  let a0 = -Math.PI/2, paths = '';
  slices.forEach(s => {
    const frac = s.pct/100;
    if (frac <= 0) return;
    if (frac >= 0.9999){ paths += `<circle cx="${C}" cy="${C}" r="${R}" fill="${s.color}"/>`; return; }
    const a1 = a0 + frac*2*Math.PI;
    const x0 = C+R*Math.cos(a0), y0 = C+R*Math.sin(a0);
    const x1 = C+R*Math.cos(a1), y1 = C+R*Math.sin(a1);
    const large = frac > 0.5 ? 1 : 0;
    paths += `<path d="M${C},${C} L${x0.toFixed(2)},${y0.toFixed(2)} A${R},${R} 0 ${large} 1 ${x1.toFixed(2)},${y1.toFixed(2)} Z" fill="${s.color}" style="stroke:var(--card);stroke-width:2"/>`;
    a0 = a1;
  });
  return `<svg viewBox="0 0 140 140">${paths}<circle cx="70" cy="70" r="30" style="fill:var(--card)"/></svg>`;
}
function renderAnalytics(){
  const monthTx = db.tx.filter(t => (t.date||'').slice(0,7) === currentMonth && t.type==='gasto' && (analyticsMode==='all' || t.paid==='paid'));
  const totalExp = monthTx.reduce((s,t) => s + (Number(t.amount)||0), 0);
  const avg = monthTx.length ? totalExp / monthTx.length : 0;
  const byCat = {};
  monthTx.forEach(t => { const k = t.cat || 'Sin categoría'; byCat[k] = (byCat[k]||0) + (Number(t.amount)||0); });
  const sorted = Object.entries(byCat).sort((a,b) => b[1]-a[1]);
  const top = sorted.length ? sorted[0][0] : 'N/A';
  const rows = sorted.map(([name, amount]) => {
    const cat = catInfo(name);
    return { name, amount, color: cat.color, icon: cat.icon, pct: totalExp > 0 ? (amount/totalExp)*100 : 0 };
  });
  const pieRows = rows.slice(0, 6);
  if (rows.length > 6){
    const restAmt = rows.slice(6).reduce((s,r) => s + r.amount, 0);
    pieRows.push({ name:'Otros', amount:restAmt, color:'#94a3b8', icon:'tag', pct: totalExp > 0 ? (restAmt/totalExp)*100 : 0 });
  }
  return `
    ${renderMonthSwitcher()}
    <div class="seg">
      <button class="${analyticsMode==='paid'?'on':''}" onclick="analyticsMode='paid'; renderApp();">Total pagado</button>
      <button class="${analyticsMode==='all'?'on':''}" onclick="analyticsMode='all'; renderApp();">Proyectado</button>
    </div>
    <div class="grid3">
      <div class="stat"><span>Total gastos</span><b class="red">${fmtS(totalExp)}</b></div>
      <div class="stat"><span>Promedio</span><b class="brandt">${fmtS(avg)}</b></div>
      <div class="stat"><span>Top</span><b style="font-size:11px">${esc(top)}</b></div>
    </div>
    <div class="card">
      <h3 class="lab" style="margin:0 0 10px">Distribución de gastos</h3>
      ${pieRows.length === 0 ? '<p class="empty">Sin datos de gastos para este filtro.</p>' : `
      <div class="pie-wrap">
        ${pieSVG(pieRows)}
        <div class="legend">
          ${pieRows.map(r => `<div><span><i style="background:${esc(r.color)}"></i>${esc(r.name)}</span><b>${r.pct.toFixed(1)}%</b></div>`).join('')}
        </div>
      </div>`}
    </div>
    <div class="card">
      <h3 class="lab" style="margin:0 0 10px">Desglose por categorías</h3>
      ${sorted.length === 0 ? '<p class="empty">Sin datos de gastos para este filtro.</p>' : ''}
      ${rows.map(r => `
        <div class="bd-row"><span><span style="color:${esc(r.color)}">${ic(r.icon)}</span>${esc(r.name)}</span><span style="font-weight:800">${db.hideAmt ? '•••' : 'S/ ' + money(r.amount)} (${r.pct.toFixed(1)}%)</span></div>
        <div class="bd-track"><i style="width:${r.pct}%;background:${esc(r.color)}"></i></div>`).join('')}
    </div>
    ${renderBudgets()}`;
}
function renderBudgets(){
  const budgeted = db.cats.filter(c => c.type === 'gasto' && Number(c.budget) > 0);
  if (!budgeted.length){
    return '<div class="card"><p class="sm" style="margin:0">Para ver presupuestos, edita una categoría de gasto y asígnale un monto mensual.</p></div>';
  }
  const spent = {};
  db.tx.forEach(t => {
    if (t.type === 'gasto' && t.paid === 'paid' && (t.date||'').slice(0,7) === currentMonth){
      spent[t.cat] = (spent[t.cat] || 0) + (Number(t.amount) || 0);
    }
  });
  const anyOver = budgeted.some(c => (spent[c.name]||0) > c.budget);
  return `
    <div class="card">
      <h3 class="lab" style="margin:0 0 10px">Presupuesto del mes</h3>
      ${budgeted.map(c => {
        const s = spent[c.name] || 0;
        const p = Math.min(100, s / c.budget * 100);
        return `
          <div class="bd-row"><span>${esc(c.name)}</span><span style="font-weight:800">${db.hideAmt ? '•••' : 'S/ ' + money(s) + ' / ' + money(c.budget)}</span></div>
          <div class="bd-track"><i style="width:${p}%;background:${s > c.budget ? '#f43f5e' : esc(c.color)}"></i></div>`;
      }).join('')}
      ${anyOver ? '<p class="sm" style="margin:4px 0 0">Algunas categorías superaron su presupuesto este mes.</p>' : ''}
    </div>`;
}

function compressImg(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const sc = Math.min(1, 360 / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.7));
      };
      img.onerror = rej;
      img.src = r.result;
    };
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}
async function pickShopImg(e){
  const f = e.target.files[0];

  try { shopImg = await compressImg(f); updateShopPreview(); }

}
function saveCat(){
  syncCatDom();
  const name = CATD.name.trim();
  if (!name){ showToast('Escribe un nombre'); return; }
  if (db.cats.some(c => c.id !== CATD.id && norm(c.name) === norm(name))){ showToast('Ya existe esa categoría'); return; }
  const data = { name, type: CATD.type, color: CATD.color, icon: CATD.icon, budget: CATD.type==='gasto' ? CATD.budget : 0 };
  const existing = CATD.id ? db.cats.find(c => c.id === CATD.id) : null;
  if (existing){
    const oldName = existing.name;
    Object.assign(existing, data);
    if (oldName !== name){
      db.tx.forEach(t => { if (t.cat === oldName) t.cat = name; });
      db.recurring.forEach(r => { if (r.cat === oldName) r.cat = name; });
      db.shopping.forEach(s => { if (s.cat === oldName) s.cat = name; });
    }
  } else {
    db.cats.push({ id:'c_'+Date.now(), ...data });
  }
  persist();
  closeModal('catModal');
  renderCategoriesList();
  if (catReturnTo === 'transactionModal'){
    populateCategoryDropdown();
    if (data.type === currentTxType) $('txCategory').value = name;
  }
  renderApp();
  showToast('Categoría guardada');
}
function deleteCat(){
  if (!CATD || !CATD.id) return;
  const c = db.cats.find(x => x.id === CATD.id);
  if (!c) return;
  if (db.cats.filter(x => x.type === c.type).length <= 1){ showToast('Debes conservar al menos una categoría de ' + c.type); return; }
  askConfirm(`Se eliminará la categoría "${c.name}". Los movimientos ya registrados se conservan.`, 'Eliminar', () => {
    db.cats = db.cats.filter(x => x.id !== c.id);
    persist(); closeModal('catModal'); renderCategoriesList(); renderApp(); showToast('Categoría eliminada');
  });
}

/* ================= ESCANEO DE BOLETA (OCR) ================= */
function loadScript(src){
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
}
async function scanReceipt(e){
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  const status = $('scanStatus');
  try {
    if (!window.Tesseract){
      status.textContent = 'Cargando lector (solo la primera vez)...';
      await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
    }
    status.textContent = 'Leyendo boleta...';
    const { data: { text } } = await Tesseract.recognize(file, 'spa');
    const p = parseReceipt(text);
    if (p.amount) $('txAmount').value = p.amount.toFixed(2);
    if (p.date){ $('txDate').value = p.date; txDateTouched = true; }
    if (p.note) $('txNote').value = p.note;
    status.textContent = p.amount ? 'Listo. Revisa el monto antes de guardar.' : 'No encontré el total. Ingrésalo a mano.';
  } catch(err){
    status.textContent = 'No se pudo leer. Revisa la conexión o intenta con más luz.';
  }
}
function parseReceipt(text){
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const out = { amount: null, date: null, note: '' };
  const totalLine = lines.find(l => /total/i.test(l) && /\d[.,]\d{2}/.test(l));
  const src = totalLine || text;
  const nums = [...src.matchAll(/\d{1,3}(?:[.,]\d{3})*[.,]\d{2}\b/g)].map(m => PARSE_NUM(m[0])).filter(n => n > 0);
  if (nums.length) out.amount = Math.max(...nums);
  let m = text.match(/(\d{2})[\/-](\d{2})[\/-](\d{4})/);
  if (m) out.date = `${m[3]}-${m[2]}-${m[1]}`;
  else if ((m = text.match(/(\d{4})-(\d{2})-(\d{2})/))) out.date = m[0];
  const nameLine = lines.find(l => /[a-zA-ZáéíóúñÁÉÍÓÚÑ]{4,}/.test(l) && !/(ruc|total|fecha|boleta|factura|igv|subtotal|direcci)/i.test(l));
  if (nameLine) out.note = nameLine.slice(0, 40);
  return out;
}

/* ================= EXCEL / RESPALDO ================= */
/* No fuerza la descarga (los visores/WebViews la bloquean).
   Muestra un modal con enlace "Descargar" y botón "Compartir", ambos con toque directo. */
let dlUrl = null;
function downloadBlob(blob, name){
  if (dlUrl) URL.revokeObjectURL(dlUrl);
  dlUrl = URL.createObjectURL(blob);
  const link = $('dlLink');
  link.href = dlUrl;
  link.download = name;
  link.target = '_blank';
  $('dlName').textContent = name;

  const file = new File([blob], name, { type: blob.type });
  const canShare = !!(navigator.canShare && navigator.canShare({ files:[file] }));
  const shareBtn = $('dlShare');
  shareBtn.hidden = !canShare;
  shareBtn.onclick = async () => {
    try { await navigator.share({ files:[file], title:name }); closeModal('dlModal'); }
    catch(err){ if (!err || err.name !== 'AbortError') showToast('No se pudo compartir; usa Descargar'); }
  };
  link.onclick = () => setTimeout(() => closeModal('dlModal'), 400);

  openModal('dlModal');
  return Promise.resolve(false);
}
const XLSX_MIME = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
const TYPE_ES = { gasto:'Gasto', ingreso:'Ingreso', transfer:'Transferencia' };

function buildWorkbook(template){
  const src = template ? templateData() : db;
  const accN = id => (src.accounts.find(a => a.id === id) || {}).name || '';
  const wb = XLSX.utils.book_new();
  const sheet = (name, rows, widths) => {
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = widths.map(w => ({ wch:w }));
    XLSX.utils.book_append_sheet(wb, ws, name);
  };
  sheet('Movimientos', [
    ['Fecha','Tipo','Monto','Categoria','Cuenta','Hacia','Descripcion','Estado'],
    ...src.tx.map(t => [t.date, TYPE_ES[t.type] || 'Gasto', t.amount, t.type==='transfer' ? '' : (t.cat||''),
      accN(t.accountId || t.acc), accN(t.transferTo || t.toAcc), t.note || '', t.paid==='paid' ? 'Pagado' : 'Pendiente'])
  ], [12,14,12,18,18,18,30,12]);
  sheet('Cuentas', [
    ['Nombre','Tipo','Saldo inicial','Limite','Dia de corte','Dia de pago'],
    ...src.accounts.map(a => [a.name, a.type==='credit' ? 'Tarjeta de credito' : 'Efectivo / Debito',
      a.initial||0, a.limit||0, a.cutoff||'', a.due||''])
  ], [24,20,16,12,14,14]);
  sheet('Categorias', [
    ['Nombre','Tipo','Icono','Color','Presupuesto mensual'],
    ...src.cats.map(c => [c.name, c.type==='ingreso' ? 'Ingreso' : 'Gasto', c.icon, c.color, c.budget||0])
  ], [24,14,14,12,20]);
  sheet('Compras', [
    ['Producto','Monto','Categoria','Cuenta'],
    ...src.shopping.map(s => [s.desc, s.amount||0, s.cat||'', accN(s.accountId)])
  ], [30,12,18,18]);
  if (template){
    sheet('Instrucciones', [
      ['Cómo usar esta plantilla'],
      ['1. Llena o edita las hojas. Borra la fila de ejemplo de Movimientos antes de importar.'],
      ['2. Tipo en Movimientos: Gasto, Ingreso o Transferencia.'],
      ['3. Estado: Pagado o Pendiente.'],
      ['4. Fecha en formato AAAA-MM-DD (ej. 2026-10-15).'],
      ['5. Cuenta y Categoria deben tener el mismo nombre que en las hojas Cuentas y Categorias. Si no existen, se crean.'],
      ['6. En Ajustes > Importar desde Excel, selecciona el archivo.']
    ], [95]);
  }
  return wb;
}
function templateData(){
  return {
    accounts:[{ id:'a1', name:'Efectivo', type:'debit', initial:0 }],
    cats: DEFAULT_CATS,
    shopping:[{ desc:'Audífonos', amount:120, cat:'Ocio', accountId:'a1' }],
    tx:[{ type:'gasto', amount:45.5, cat:'Mercado', accountId:'a1', note:'Ejemplo: supermercado', date:todayStr(), paid:'paid' }]
  };
}
function exportExcel(){
  if (typeof XLSX === 'undefined'){ showToast('Sin conexión: no cargó la librería de Excel. Usa el respaldo JSON.'); return; }
  try {
    const out = XLSX.write(buildWorkbook(false), { bookType:'xlsx', type:'array' });
    downloadBlob(new Blob([out], { type: XLSX_MIME }), `finanzas_${todayStr()}.xlsx`);
  } catch(err){ showToast('No se pudo generar el Excel'); }
}
function downloadTemplate(){
  if (typeof XLSX === 'undefined'){ showToast('Sin conexión: no cargó la librería de Excel'); return; }
  try {
    const out = XLSX.write(buildWorkbook(true), { bookType:'xlsx', type:'array' });
    downloadBlob(new Blob([out], { type: XLSX_MIME }), 'plantilla_finanzas.xlsx');
  } catch(err){ showToast('No se pudo generar la plantilla'); }
}
function toISO(v){
  if (v instanceof Date) return toDateStr(v);
  if (typeof v === 'number'){
    const d = new Date(Math.round((v - 25569) * 86400000));
    return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`;
  }
  const s = String(v==null?'':v).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  m = s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);
  if (m) return `${m[3]}-${pad(+m[2])}-${pad(+m[1])}`;
  return '';
}
function normType(s){
  const n = norm(s);
  if (n.startsWith('transf')) return 'transfer';
  if (n.startsWith('ing')) return 'ingreso';
  return 'gasto';
}
function importWorkbook(wb){
  const rows = names => {
    for (const n of names){ const sh = wb.Sheets[n]; if (sh) return XLSX.utils.sheet_to_json(sh, { defval:'' }); }
    return [];
  };
  const pick = (r, ...keys) => {
    for (const k of Object.keys(r)){
      if (keys.some(x => norm(k) === norm(x)) && String(r[k]).trim() !== '') return r[k];
    }
    return '';
  };
  const res = { tx:0, accounts:0, cats:0, shop:0 };

  const findAcc = name => {
    name = String(name==null?'':name).trim();
    if (!name) return db.accounts[0] ? db.accounts[0].id : null;
    let a = db.accounts.find(x => norm(x.name) === norm(name));
    if (!a){
      a = { id:uid(), name, type:'debit', initial:0, color:'#6366f1' };
      db.accounts.push(a); res.accounts++;
    }
    return a.id;
  };
  const findCatName = (name, type) => {
    name = String(name==null?'':name).trim();
    if (!name || type === 'transfer') return '';
    let c = db.cats.find(x => norm(x.name) === norm(name));
    if (!c){
      c = { id:uid(), name, type: type==='ingreso' ? 'ingreso' : 'gasto', icon:'tag',
        color: PALETTE[db.cats.length % PALETTE.length], budget:0 };
      db.cats.push(c); res.cats++;
    }
    return c.name;
  };

  rows(['Cuentas']).forEach(r => {
    const name = String(pick(r,'Nombre')).trim();
    if (!name || db.accounts.some(a => norm(a.name) === norm(name))) return;
    const isCred = norm(pick(r,'Tipo')).startsWith('tarjeta') || norm(pick(r,'Tipo')).startsWith('cred');
    db.accounts.push({ id:uid(), name, type: isCred ? 'credit' : 'debit',
      initial: PARSE_NUM(pick(r,'Saldo inicial')), limit: PARSE_NUM(pick(r,'Limite')),
      cutoff: parseInt(pick(r,'Dia de corte')) || 0, due: parseInt(pick(r,'Dia de pago')) || 0,
      color: PALETTE[db.accounts.length % PALETTE.length] });
    res.accounts++;
  });

  rows(['Categorias','Categorías']).forEach(r => {
    const name = String(pick(r,'Nombre')).trim();
    if (!name || db.cats.some(c => norm(c.name) === norm(name))) return;
    const ico = String(pick(r,'Icono')).trim();
    const col = String(pick(r,'Color')).trim();
    db.cats.push({ id:uid(), name,
      type: norm(pick(r,'Tipo')).startsWith('ing') ? 'ingreso' : 'gasto',
      icon: ICON_KEYS.has(ico) ? ico : 'tag',
      color: /^#[0-9a-f]{6}$/i.test(col) ? col : PALETTE[db.cats.length % PALETTE.length],
      budget: PARSE_NUM(pick(r,'Presupuesto mensual')) });
    res.cats++;
  });

  rows(['Movimientos']).forEach(r => {
    const amount = PARSE_NUM(pick(r,'Monto'));
    const date = toISO(pick(r,'Fecha'));
    if (!(amount > 0) || !date) return;
    const type = normType(pick(r,'Tipo'));
    const acc = findAcc(pick(r,'Cuenta'));
    db.tx.push({
      id: uid(), type,
      amount: Math.round(amount * 100) / 100,
      cat: findCatName(pick(r,'Categoria'), type),
      accountId: acc,
      transferTo: type === 'transfer' ? findAcc(pick(r,'Hacia')) : undefined,
      note: String(pick(r,'Descripcion')),
      date,
      paid: norm(pick(r,'Estado')).startsWith('pend') ? 'pending' : 'paid'
    });
    res.tx++;
  });

  rows(['Compras']).forEach(r => {
    const desc = String(pick(r,'Producto')).trim();
    if (!desc) return;
    db.shopping.push({ id:'sh_'+uid(), desc, amount: PARSE_NUM(pick(r,'Monto')),
      cat: findCatName(pick(r,'Categoria'), 'gasto'), accountId: findAcc(pick(r,'Cuenta')), img:'' });
    res.shop++;
  });
  return res;
}
function importExcel(e){
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!f) return;
  if (typeof XLSX === 'undefined'){ showToast('Sin conexión: no cargó la librería de Excel'); return; }
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const wb = XLSX.read(new Uint8Array(reader.result), { type:'array' });
      const r = importWorkbook(wb);
      persist(); closeModal('settingsModal'); renderApp();
      showToast(`Importado: ${r.tx} movimientos, ${r.accounts} cuentas, ${r.cats} categorías, ${r.shop} compras`);
    } catch(err){ showToast('No se pudo importar el Excel'); }
  };
  reader.readAsArrayBuffer(f);
}
async function exportBackup(){
  const data = JSON.stringify({ app:'yeferson_acp', version:7, exported:new Date().toISOString(), db }, null, 2);
  await downloadBlob(new Blob([data], { type:'application/json' }), `yeferson_respaldo_${todayStr()}.json`);
}
function importBackup(e){
  const input = e.target, file = input.files[0];
  input.value = '';
  if (!file) return;
  const reader = new FileReader();
  reader.onload = evt => {
    try {
      const obj = JSON.parse(String(evt.target.result || ''));
      const d = obj && obj.db ? obj.db : obj;
      if (!d || !Array.isArray(d.tx) || !Array.isArray(d.accounts)) throw new Error('formato');
      askConfirm('Esto reemplazará tus datos actuales por los del respaldo.', 'Restaurar', () => {
        localStorage.setItem(KEY, JSON.stringify(d));
        location.reload();
      });
    } catch(err){ showToast('El archivo no es un respaldo válido'); }
  };
  reader.readAsText(file);
}
function resetData(){
  askConfirm('Se borrarán todas tus cuentas, categorías, movimientos y la lista de compras. No se puede deshacer.', 'Borrar todo', () => {
    try { localStorage.removeItem(KEY); localStorage.removeItem(OLD_KEY); } catch(e){}
    location.reload();
  });
}
